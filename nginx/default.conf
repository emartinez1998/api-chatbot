server {
    listen 80;

    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    # Aumentar el límite de tamaño de archivo a 10MB

    # Ruta a los certificados SSL
    ssl_certificate /etc/letsencrypt/live/bridgechat.liiffe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridgechat.liiffe.com/privkey.pem;

    # Configuraciones adicionales de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}